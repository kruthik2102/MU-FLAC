name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.50.1'

jobs:
  check:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Keystore secrets missing - APK will be debug-signed and cannot update a release-signed install."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > android/app/upload.p12
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=muflac"
            echo "storeFile=upload.p12"
            echo "storeType=pkcs12"
          } > android/key.properties
      - run: flutter pub get
      - name: Build APK (universal)
        run: flutter build apk --release
      - name: Verify no INTERNET permission
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee perms.txt
            if grep -q "android.permission.INTERNET" perms.txt; then
              echo "::error::Release APK requests INTERNET"; exit 1
            fi
          else
            echo "::warning::aapt2 not found; skipped permission check"
          fi
      - run: cp build/app/outputs/flutter-apk/app-release.apk MU-FLAC.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MU-FLAC-apk
          path: MU-FLAC.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        run: |
          rm -rf Payload MU-FLAC.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry MU-FLAC.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MU-FLAC-ipa
          path: MU-FLAC.ipa
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MU-FLAC-apk
      - uses: actions/download-artifact@v4
        with:
          name: MU-FLAC-ipa
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## MU-FLAC - offline FLAC player

          **100% offline.** No internet permission, no accounts, no tracking.

          ### Android - `MU-FLAC.apk`
          1. Download `MU-FLAC.apk` on your phone and open it.
          2. Allow "Install unknown apps" for your browser / file manager when asked.
          3. Open MU-FLAC, allow access to music, and add your music folder(s).
          Updates install over the previous version (same signing key).

          ### iPhone - `MU-FLAC.ipa` (unsigned, sideload)
          The IPA is not signed. Sign and install it with your own Apple ID using
          **AltStore** or **Sideloadly** (free Apple ID: the app must be re-signed
          every **7 days**; AltStore can refresh it automatically).
          - Sideloadly: connect the iPhone, drag `MU-FLAC.ipa` in, enter your Apple ID, Start.
          - AltStore: My Apps -> + -> pick `MU-FLAC.ipa`.
          Then on the iPhone: Settings -> General -> VPN & Device Management -> trust your Apple ID
          (and enable Developer Mode if asked).

          ### Adding music
          - Android: in the app, add the folder(s) that hold your `.flac` files.
          - iPhone: copy files into **Files -> On My iPhone -> MU-FLAC** (or via the Windows
            "Apple Devices" app -> Files -> MU-FLAC), or pick any folder in Files from the
            app's settings, or use "Import files".
          NOTES
          gh release create "$TAG" MU-FLAC.apk MU-FLAC.ipa \
            --repo "$GITHUB_REPOSITORY" --title "MU-FLAC $TAG" --notes-file notes.md
